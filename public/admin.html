<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — SHOVON SHARE ZONE</title><link rel="stylesheet" href="/styles.css"></head><body><header class="top"><a class="brand" href="/"><span class="brandmark">S</span><span>SHOVON <b>SHARE ZONE</b></span></a><a class="adminlink" href="/">View gallery</a></header><main class="admin"><p class="eyebrow">OWNER ACCESS ONLY</p><h1>Gallery admin</h1><section id="login" class="panel"><h2>Sign in</h2><label class="field">Admin password<input id="password" type="password" autocomplete="current-password"></label><button id="loginBtn" class="primary">Sign in</button><p id="loginMsg" class="status"></p></section><section id="dashboard" class="hidden"><div class="panel"><h2>Add photos</h2><label class="field">Album name<input id="album" maxlength="80" value="My Gallery"></label><label class="field">Choose images<input id="files" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif" multiple></label><p class="note">Images only. Up to 30 images per upload, maximum 25 MB each.</p><button id="uploadBtn" class="primary">Upload selected photos</button><p id="uploadMsg" class="status"></p></div><div class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Your photos</h2><button id="logout" class="adminlink">Sign out</button></div><div id="list"></div></div></section></main><script src="/admin.js"></script></body></html>
